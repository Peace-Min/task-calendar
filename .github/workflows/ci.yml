name: CI

# ── 언제 돌릴지(트리거) ──
on:
  push:
    branches: [main]     # main에 직접 푸시할 때(마스터 푸시 포함)
  pull_request:          # PR을 열거나 갱신할 때

# 최소 권한(읽기 전용) — 보안 기본값.
permissions:
  contents: read

jobs:
  # ── JS 테스트 하니스 (데이터 직렬화·보고서 생성·순수 로직) ──
  test:
    name: 테스트 하니스 (JS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node 20 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Layer 1(순수 함수)은 의존성 0, Layer 2(app-context, XML 왕복·보고서)는
      # jsdom 필요 → tests/에서 test-only devDependency 설치.
      - name: 테스트 의존성 설치 (jsdom)
        run: npm ci
        working-directory: tests

      - name: 테스트 실행
        run: node tests/run-tests.mjs

  # ── 위젯 컴파일 회귀 체크 (.NET/WPF) ──
  build-widget:
    name: 위젯 컴파일 체크 (.NET)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: .NET 9 SDK 설치
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # nuget-packages가 저장소에 동봉돼 오프라인 복원 가능. publish/배포는 안 함(컴파일만).
      - name: 위젯 빌드 (컴파일 회귀 체크)
        run: dotnet build widget/TaskCalendarWidget.csproj -c Release --nologo
