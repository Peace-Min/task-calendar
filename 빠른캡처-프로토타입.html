<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 줄 빠른 캡처 — 적용 프로토타입</title>
<style>
:root{--bg:#f3f4f7;--panel:#fff;--line:#e4e7ee;--line2:#d6dbe6;--text:#1d2433;--muted:#5b6373;--faint:#9aa2b3;--accent:#3e5be0;--titlebar:#222a3d;--ok:#0f6e56}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif;background:#eceef3;color:var(--text);padding:22px}
h1{font-size:18px;margin:0 0 4px}
.sub{font-size:13px;color:var(--muted);margin:0 0 18px;line-height:1.6;max-width:560px}
.stage{display:flex;justify-content:center}
.phone{width:360px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 8px 28px rgba(20,28,55,.13)}
.bar{height:30px;background:var(--titlebar);color:#fff;font-size:11px;display:flex;align-items:center;padding:0 11px;gap:6px}
.ctx{font-size:11px;color:var(--faint);padding:7px 12px 0}
.cap{padding:10px 12px 12px}
.r1{display:flex;gap:6px;align-items:center}
.tg{display:flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;flex:none}
.tg button{font-size:11px;padding:7px 10px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-family:inherit}
.tg button.on{background:var(--accent);color:#fff;font-weight:600}
.in{flex:1;min-width:0;height:34px;border:1px solid var(--line2);border-radius:7px;padding:0 10px;font-size:13px;font-family:inherit;color:var(--text)}
.add{flex:none;height:34px;border:none;background:var(--accent);color:#fff;border-radius:7px;padding:0 13px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.chips{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:10px;background:var(--bg);border-radius:9px;padding:3px 9px;color:var(--muted)}
.hint{font-size:10px;color:var(--faint)}
.more{margin-top:9px;font-size:12px;color:var(--accent);cursor:pointer;user-select:none;display:inline-block}
.detail{margin-top:9px;border-top:1px solid var(--line);padding-top:9px}
.detail[hidden]{display:none}
.fld{margin-bottom:8px}
.fld .lb{font-size:10px;color:var(--faint);margin-bottom:3px}
.fld select,.fld input,.fld textarea{width:100%;border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-size:12px;background:#fff;font-family:inherit}
.two{display:flex;gap:8px}.two>div{flex:1}
.chk{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.list{border-top:1px solid var(--line);padding:9px 12px 12px;min-height:44px}
.list .lbl{font-size:10px;color:var(--faint);margin-bottom:5px}
.item{display:flex;align-items:center;gap:7px;padding:5px 0;font-size:12px}
.empty{font-size:11px;color:var(--faint);padding:4px 0}
.gate{display:flex;gap:8px;margin:16px auto 0;flex-wrap:wrap;justify-content:center;max-width:560px}
.gate span{font-size:11px;color:var(--ok);background:#e1f5ee;border-radius:9px;padding:3px 10px}
</style>
</head>
<body>
<h1>한 줄 빠른 캡처 — 적용 프로토타입</h1>
<p class="sub">진단의 방향을 적용한 모습입니다. <b>일정/할일 토글 + 제목 한 줄 + 추가</b>가 기본이고, 반복·시간·메모 같은 상세는 <b>상세 ▾</b>를 누를 때만 펼쳐집니다(현 16칸 모달은 이 펼친 상태 + 편집 전용으로 강등). 표시 축(캘린더·우측 탭)은 그대로 둡니다.</p>
<div class="stage">
  <div class="phone">
    <div class="bar">▦ 수행과제 캘린더</div>
    <div class="ctx">2026. 6 · 선택한 날짜 <b>6/16 (월)</b> 자동 상속</div>
    <div class="cap">
      <div class="r1">
        <div class="tg"><button id="tgEvent" class="on">일정</button><button id="tgTodo">할 일</button></div>
        <input class="in" id="qcIn" type="text" placeholder="무엇을 했나요 / 할 예정인가요?">
        <button class="add" id="qcAdd">추가</button>
      </div>
      <div class="chips" id="qcChips"></div>
      <div class="more" id="qcMore">▾ 상세 (반복·시간·메모) — 필요할 때만</div>
      <div class="detail" id="qcDetail" hidden></div>
    </div>
    <div class="list">
      <div class="lbl">오늘 추가됨</div>
      <div id="qcItems"><div class="empty">아직 없음 — 제목 적고 <b>추가</b>를 눌러보세요</div></div>
    </div>
  </div>
</div>
<div class="gate">
  <span>✓ 진입점 1개</span><span>✓ 스크롤 0</span><span>✓ 기본 컨트롤 3개</span><span>✓ 반복·기간 숨김</span>
</div>
<script>
(function(){
  var type='event', inp=document.getElementById('qcIn'), chips=document.getElementById('qcChips'),
      detail=document.getElementById('qcDetail'), items=document.getElementById('qcItems'),
      more=document.getElementById('qcMore');
  function renderChips(){
    chips.innerHTML = type==='event'
      ? '<span class="chip">📅 6/16</span><span class="chip">＃과제 없음</span><span class="hint">— 제목만 적어도 바로 저장</span>'
      : '<span class="chip">⏳ 기한 6/16</span><span class="chip">＃과제 없음</span><span class="hint">— 기한 비우면 ‘기한없음’</span>';
  }
  function renderDetail(){
    detail.innerHTML = type==='event'
      ? '<div class="fld"><div class="lb">과제</div><select><option>과제 없음</option><option>보고서 작성</option><option>시스템 점검</option></select></div>'
        +'<label class="chk"><input type="checkbox" checked> 종일</label>'
        +'<div class="two" style="margin-top:7px"><div><div class="lb">시작</div><input type="time"></div><div><div class="lb">종료</div><input type="time"></div></div>'
        +'<div class="fld" style="margin-top:7px"><div class="lb">반복</div><select><option>안 함</option><option>매주</option><option>매월</option></select></div>'
        +'<div class="fld"><div class="lb">메모</div><textarea rows="2"></textarea></div>'
      : '<div class="fld"><div class="lb">과제</div><select><option>과제 없음</option><option>보고서 작성</option><option>시스템 점검</option></select></div>'
        +'<div class="fld"><div class="lb">기한</div><input type="date"></div>'
        +'<label class="chk"><input type="checkbox"> ★ 중요</label>'
        +'<div class="fld" style="margin-top:7px"><div class="lb">메모</div><textarea rows="2"></textarea></div>';
  }
  function setType(t){ type=t;
    document.getElementById('tgEvent').classList.toggle('on',t==='event');
    document.getElementById('tgTodo').classList.toggle('on',t==='todo');
    renderChips(); if(!detail.hasAttribute('hidden')) renderDetail();
    inp.placeholder = t==='event' ? '무엇을 했나요 / 할 예정인가요?' : '할 일을 한 줄로';
  }
  function add(){
    var v=(inp.value||'').trim(); if(!v){ inp.focus(); return; }
    var e=items.querySelector('.empty'); if(e) e.remove();
    var row=document.createElement('div'); row.className='item';
    row.innerHTML=(type==='event'?'📅':'✅')+' <span style="flex:1">'+v.replace(/</g,'&lt;')+'</span><span class="chip">'+(type==='event'?'일정':'할 일')+'</span>';
    items.insertBefore(row, items.firstChild); inp.value=''; inp.focus();
  }
  document.getElementById('tgEvent').onclick=function(){setType('event');};
  document.getElementById('tgTodo').onclick=function(){setType('todo');};
  document.getElementById('qcAdd').onclick=add;
  inp.addEventListener('keydown',function(ev){ if(ev.key==='Enter') add(); });
  more.onclick=function(){ var h=detail.hasAttribute('hidden'); if(h){ renderDetail(); detail.removeAttribute('hidden'); more.textContent='▴ 상세 접기'; } else { detail.setAttribute('hidden',''); more.textContent='▾ 상세 (반복·시간·메모) — 필요할 때만'; } };
  renderChips();
})();
</script>
</body>
</html>
