<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과제 날짜 목록 확정안</title>
<style>
/* ===== 앱 토큰(task-calendar-prototype.html :root, html.dark 에서 복사). .dk 는 장면 하나만 다크로 칠한다 ===== */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f3f4f7; --panel:#ffffff; --line:#e4e7ee; --line-2:#d6dbe6; --ctl-border:#8b93a5;
  --text:#1d2433; --muted:#5b6373; --faint:#9aa2b3; --faint-text:#6c7488;
  --accent:#3e5be0; --accent-2:#2e44ad; --accent-soft:#eef1fd; --accent-fill:var(--accent); --on-accent:#fff;
  --sun:#c43a3f; --sat:#4b62a0; --wknd-sun-bg:#faedee; --wknd-sat-bg:#eff1f6;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --shadow:0 10px 32px rgba(20,28,55,.16);
  --fs-micro:11px; --fs-meta:12px; --fs-body:13px; --fs-emph:14px; --fs-title:15px; --fs-h2:17px; --fs-head:18px; --fs-display:22px;
  --hover-bg:#f3f5fa; --dim-bg:#fafbfd; --btn-hover-line:#bcc4d6;
}
html.dark,.dk{
  color-scheme:dark;
  --bg:#0f1420; --panel:#1a2031; --line:#2a3245; --line-2:#3a4357;
  --text:#e6e9f2; --muted:#a8b0c3; --faint:#5c6578; --faint-text:#9aa3b7;
  --accent:#6182ff; --accent-2:#9db0ff; --accent-soft:#1d2742; --accent-fill:#4f66d8; --ctl-border:#666f8a;
  --sun:#ff7d82; --sat:#90a4e8;
  --hover-bg:#222b3e; --shadow:0 12px 34px rgba(0,0,0,.55); --dim-bg:#141a27;
  --wknd-sun-bg:#2f2838; --wknd-sat-bg:#252c41; --btn-hover-line:#49546e;
}
body{font-family:'Segoe UI','Malgun Gothic','맑은 고딕',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs-emph);
  font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:anywhere}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;vertical-align:-3px;pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--panel);color:var(--text);
  padding:8px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-emph);transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--btn-hover-line);background:var(--hover-bg)}
.btn.sm{padding:4px 10px;font-size:var(--fs-body)}

/* ===== 확정안: 그날 일정 목록 팝오버 ===== */
.dp{width:320px;max-width:calc(100vw - 16px);max-height:440px;display:flex;flex-direction:column;background:var(--panel);color:var(--text);
  border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow);font-size:var(--fs-body);text-align:left}
.dp-top{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 14px;flex:none;min-height:44px}
.dp-date{font-size:var(--fs-title);font-weight:700;flex:1;min-width:0}
.dp-date .sun{color:var(--sun)} .dp-date .sat{color:var(--sat)}
.dp-body{overflow-y:auto;overflow-x:hidden;min-height:0;padding:0 8px 8px}
.dp-g + .dp-g{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.dp-gh{position:sticky;top:0;z-index:1;background:var(--panel);display:flex;align-items:center;gap:7px;padding:5px 6px 3px;font-size:var(--fs-meta);font-weight:700;color:var(--text)}
.dp-gh i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.dp-gh .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-gh .end{flex:none;font-weight:400;font-size:var(--fs-micro);color:var(--faint-text)}
.dp-row{display:flex;align-items:flex-start;gap:6px;width:100%;border:0;background:transparent;font:inherit;font-size:var(--fs-body);line-height:1.4;
  text-align:left;color:var(--text);padding:4px 6px 4px 23px;border-radius:var(--r-sm);cursor:pointer}
.dp-row:hover{background:var(--hover-bg)}
.dp-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dp-tt{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dp-tm{font-size:var(--fs-meta);font-weight:700;margin-right:6px}
.dp-rg{font-size:var(--fs-meta);color:var(--muted);margin-right:6px}
.dp-row .mi{flex:none;display:inline-flex;color:var(--muted);margin-top:3px}
.dp-row .mi .ic{width:11px;height:11px}
/* 좁은 폭(760px 이하): 하단 시트 */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-radius:14px 14px 0 0;max-height:84%;display:flex;flex-direction:column;box-shadow:0 -8px 28px rgba(20,28,55,.18)}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:8px auto 2px;flex:none}
.sheet .dp{width:auto;max-width:none;max-height:none;border:0;box-shadow:none;border-radius:0;flex:1;min-height:0}
.sheet .dp-top{padding:6px 16px 8px}
.sheet .dp-body{padding:0 10px 16px}
.sheet .dp-row{padding-top:7px;padding-bottom:7px}

/* ===== 비교 페이지 틀 ===== */
.page{max-width:1520px;margin:0 auto;padding:24px 20px 80px}
.page h1{font-size:var(--fs-display);font-weight:700}
.page > p{color:var(--muted);font-size:var(--fs-body);line-height:1.6;margin:4px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(720px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px 16px}
.card h2{font-size:var(--fs-title);font-weight:700}
.card .why{font-size:var(--fs-meta);color:var(--muted);margin:3px 0 10px;line-height:1.6}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stage{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 8px;min-height:120px;display:flex;justify-content:center;align-items:flex-start}
.stage.dk{border-color:#2a3245}
.wide{grid-column:1 / -1}
.scenes{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.scene{position:relative;overflow:hidden;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--bg);flex:none}
.scene.desk{width:880px;height:560px}
.scene.mob{width:375px;height:640px}
.lbl{font-size:var(--fs-micro);color:var(--muted);margin:0 0 4px}

/* 장면 속 달력(과제 탭 흉내) */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text)}
.app-tabs{display:flex;gap:2px;padding:6px 10px 0;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
.app-tabs span{padding:7px 10px;font-size:var(--fs-body);color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.app-tabs span.on{color:var(--accent-2);font-weight:600;border-bottom-color:var(--accent)}
.app-main{flex:1;min-height:0;display:flex}
.app-side{width:180px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:4px}
.app-side b{font-size:var(--fs-title);margin:0 4px 6px}
.app-side .pr{display:flex;gap:7px;align-items:flex-start;font-size:var(--fs-body);padding:4px}
.app-side .pr i{width:10px;height:10px;border-radius:50%;flex:none;margin-top:4px}
.app-side .pr input{margin-top:3px;width:14px;height:14px}
.app-cal{flex:1;min-width:0;display:flex;flex-direction:column;padding:8px 10px}
.app-calh{display:flex;align-items:center;gap:8px;height:34px;flex:none}
.app-calh b{font-size:var(--fs-title)}
.app-wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:var(--fs-meta);color:var(--muted);text-align:center;height:20px;flex:none}
.app-wk span:first-child{color:var(--sun)} .app-wk span:last-child{color:var(--sat)}
.app-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.app-cell{background:var(--panel);padding:2px 3px;min-width:0;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.app-cell.dim{background:var(--dim-bg)} .app-cell.dim .num{color:var(--faint-text)}
.app-cell.sun:not(.sel){background:var(--wknd-sun-bg)} .app-cell.sat:not(.sel){background:var(--wknd-sat-bg)}
.app-cell.sel{box-shadow:inset 0 0 0 2px var(--ctl-border)}
.num{font-size:var(--fs-body);font-weight:600;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.app-cell.sun .num{color:var(--sun)} .app-cell.sat .num{color:var(--sat)}
.app-cell.today .num{background:var(--accent-fill);color:var(--on-accent)}
.mc{font-size:var(--fs-micro);line-height:16px;height:16px;border-radius:4px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--c);background:var(--cb);flex:none}
.mc.t{border-left-color:transparent;background:transparent;padding-left:1px}
.mc.t i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:3px;vertical-align:1px}
.mmore{font-size:var(--fs-micro);color:var(--muted);padding:0 4px;line-height:14px}
.dimmer{position:absolute;inset:0;background:rgba(18,23,42,.45)}
.app.narrow .app-side{display:none}
.app.narrow .app-cal{padding:6px}
.app.narrow .mc{font-size:10px;padding:0 2px}
.anchored{position:absolute;z-index:5}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2433;color:#fff;font-size:var(--fs-body);padding:8px 14px;border-radius:var(--r-sm);box-shadow:var(--shadow);z-index:60;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="page">
  <h1>과제 날짜 목록 확정안(C, 과제별 묶음)</h1>
  <p>과제 달력에서 날짜를 누르면 뜨는 그날 일정 목록. 장면마다 왼쪽 라이트, 오른쪽 다크. 줄을 누르면 지금처럼 상세 창이 열린다(여기서는 토스트로 시늉).<br>
  결정 정리: docs/PROJECT-CAL-DAY-POPUP-DECISIONS.md</p>
  <div class="grid" id="grid"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== 데이터 ===== */
const P = {
  p1:{ name:'차세대 통합관제 구축', color:'#3e5be0', w:true },
  p2:{ name:'보안 점검 과제',       color:'#e0892e', w:true },
  p3:{ name:'종료된 과제 예시',     color:'#8b5cf6', w:false },
};
const ORDER = ['p1','p2','p3'];   /* pcOrder: 왼쪽 과제 목록 순서 */
const TODAY = '2026-10-30';
const E = (p, title, s, e, st, et, memo) => ({ p, title, s, e: e || s, st, et, memo });
const BUSY = [
  E('p1','현장 시험','2026-10-28','2026-10-31'),
  E('p2','외부 감리 대응 주간','2026-10-29','2026-11-02',null,null,'감리단 상주'),
  E('p3','최종 납품','2026-10-30'),
  E('p1','2차 설계 검토 회의','2026-10-30',null,'14:00','15:30','안건 있음'),
  E('p1','통합 시험 리허설 및 결과 보고회 사전 점검과 발표 자료 최종 검토','2026-10-30',null,'16:00','17:30','순서표'),
  E('p2','주간 진척 점검','2026-10-30',null,'10:00','10:30'),
  E('p3','준공 서류 제출','2026-10-30',null,'09:00','10:00'),
];
const MANY = [
  E('p1','현장 시험','2026-10-28','2026-11-03'),
  E('p1','계측 장비 반출','2026-11-02'),
  E('p1','시험 결과 1차 정리','2026-11-02',null,null,null,'양식은 공유 폴더'),
  E('p1','인터페이스 명세 회람','2026-11-02'),
  E('p1','아침 점검 회의','2026-11-02',null,'09:00','09:30'),
  E('p1','협력사 기술 회의','2026-11-02',null,'11:00','12:00','회의실 예약됨'),
  E('p1','통합 시험 리허설 및 결과 보고회 사전 점검과 발표 자료 최종 검토','2026-11-02',null,'15:00','17:00'),
  E('p2','외부 감리 대응 주간','2026-10-29','2026-11-02'),
  E('p2','취약점 조치 결과 제출','2026-11-02'),
  E('p2','점검 체크리스트 배포','2026-11-02'),
  E('p2','감리 종료 회의','2026-11-02',null,'16:00','17:00'),
  E('p3','하자 보수 기간','2026-10-20','2026-11-20'),
  E('p3','유지보수 인수인계','2026-11-02',null,'10:00','11:00'),
];
const SCENES = [
  { t:'일정 많은 날(과제 3개, 종료 과제, 긴 제목, 메모 표시)', ds:'2026-10-30', vis:['p1','p2','p3'], ev:BUSY },
  { t:'한 과제뿐인 날(종일 1건, 시간 일정 2건)', ds:'2026-10-28', vis:['p1','p2','p3'], ev:[
      E('p1','현장 시험','2026-10-28','2026-10-31'), E('p1','장비 반입 확인','2026-10-28',null,'09:30','10:00'), E('p1','현장 시험 1일차 계측','2026-10-28',null,'13:00','17:00','계측표 출력')] },
  { t:'일정 1건뿐인 날', ds:'2026-10-22', vis:['p1','p2','p3'], ev:[E('p1','협력사 회의','2026-10-22',null,'15:00','16:00')] },
  { t:'시간 없는 일정만 있는 날', ds:'2026-10-14', vis:['p1','p2','p3'], ev:[
      E('p1','설계서 v0.9 제출','2026-10-14'), E('p1','인터페이스 명세 회람','2026-10-14',null,null,null,'의견은 금요일까지'),
      E('p2','취약점 점검','2026-10-13','2026-10-15'), E('p2','점검 체크리스트 배포','2026-10-14')] },
  { t:'빈 날', ds:'2026-10-27', vis:['p1','p2','p3'], ev:[] },
  { t:'종료 과제만 있는 날(등록 단추 없음)', ds:'2026-10-20', vis:['p3'], ev:[
      E('p3','최종 납품','2026-10-20'), E('p3','준공 검사','2026-10-20',null,'10:00','12:00')] },
  { t:'일정이 아주 많은 날(13건). 최대 높이 440px, 날짜 머리는 고정, 과제 머리는 위에 붙어 따라온다', ds:'2026-11-02', vis:['p1','p2','p3'], ev:MANY },
];

/* ===== 도구 ===== */
const DOW = '일월화수목금토';
const dt = ds => { const [y,m,d] = ds.split('-').map(Number); return new Date(y, m-1, d); };
const sh = ds => { const x = dt(ds); return (x.getMonth()+1) + '/' + x.getDate(); };
const ymd = x => x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tint(hex, a){ const n = parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function svgIc(inner, w){ return `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||1.9}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`; }
const IC_MEMO = svgIc('<path d="M5 6h14M5 11h14M5 16h9"/>', 2.2);   /* PC_IC.memo */
const timed = e => !!e.st && e.s === e.e;
const dateHead = ds => { const x = dt(ds), w = x.getDay(); return (x.getMonth()+1) + '월 ' + x.getDate() + '일 ' + (w === 0 ? '<span class="sun">(일)</span>' : w === 6 ? '<span class="sat">(토)</span>' : '(' + DOW[w] + ')'); };

/* 과제 안 정렬: 막대(여러 날, 종일) 먼저 시작일 순, 긴 것 먼저. 그 아래 시각 일정 시각 순 */
function inProj(a, b){
  const ta = timed(a), tb = timed(b);
  if(ta !== tb) return ta ? 1 : -1;
  if(ta) return a.st < b.st ? -1 : a.st > b.st ? 1 : 0;
  if(a.s !== b.s) return a.s < b.s ? -1 : 1;
  if(a.e !== b.e) return a.e > b.e ? -1 : 1;
  return 0;
}

/* ===== 확정안 렌더 ===== */
function dayPop(sc){
  const evs = sc.ev.filter(e => sc.vis.includes(e.p) && e.s <= sc.ds && e.e >= sc.ds);
  const canNew = sc.vis.some(p => P[p].w);
  const groups = ORDER.filter(p => evs.some(e => e.p === p)).map(p => {
    const rows = evs.filter(e => e.p === p).sort(inProj).map(e => {
      const pre = timed(e) ? '<span class="dp-tm">' + e.st + '~' + (e.et || '') + '</span>'
        : e.s !== e.e ? '<span class="dp-rg">' + sh(e.s) + '~' + sh(e.e) + '</span>' : '';
      const aria = P[p].name + ', ' + (timed(e) ? e.st + '~' + (e.et || '') + ', ' : '') + e.title + (e.memo ? ', 메모 있음' : '') + (P[p].w ? '' : ', 종료');
      return '<button type="button" class="dp-row" data-open aria-label="' + esc(aria) + '"><span class="dp-tt">' + pre + esc(e.title) + '</span>'
        + (e.memo ? '<span class="mi" title="메모 있음">' + IC_MEMO + '</span>' : '') + '</button>';
    }).join('');
    return '<div class="dp-g" style="--c:' + P[p].color + '"><div class="dp-gh"><i></i><span class="nm">' + esc(P[p].name) + '</span>'
      + (P[p].w ? '' : '<span class="end">종료</span>') + '</div>' + rows + '</div>';
  }).join('');
  return '<div class="dp" role="dialog" aria-label="' + esc(sc.ds) + ' 일정 목록"><div class="dp-top"><span class="dp-date">' + dateHead(sc.ds) + '</span>'
    + (canNew ? '<button type="button" class="btn sm" data-new>등록</button>' : '') + '</div>'
    + (groups ? '<div class="dp-body">' + groups + '</div>' : '') + '</div>';
}

/* ===== 달력 장면 ===== */
const CAL_EV = BUSY.concat([
  E('p1','착수 보고','2026-10-06',null,'10:00','11:00'), E('p2','취약점 점검','2026-10-13','2026-10-15'),
  E('p1','협력사 회의','2026-10-22',null,'15:00','16:00'), E('p3','하자 보수 착수','2026-10-20'),
]);
function calendarHtml(narrow){
  const first = dt('2026-09-27'); let cells = '';
  for(let i = 0; i < 35; i++){
    const x = new Date(first); x.setDate(first.getDate() + i); const ds = ymd(x), w = x.getDay();
    const evs = CAL_EV.filter(e => e.s <= ds && e.e >= ds).sort(inProj);
    const chips = evs.slice(0, 2).map(e => {
      const cv = '--c:' + P[e.p].color + ';--cb:' + tint(P[e.p].color, .2);
      return timed(e) ? '<div class="mc t" style="' + cv + '"><i></i>' + (narrow ? '' : e.st + ' ') + esc(e.title) + '</div>' : '<div class="mc" style="' + cv + '">' + esc(e.title) + '</div>';
    }).join('');
    cells += '<div class="app-cell' + (x.getMonth() !== 9 ? ' dim' : '') + (w === 0 ? ' sun' : w === 6 ? ' sat' : '') + (ds === TODAY ? ' today sel' : '') + '">'
      + '<span class="num">' + x.getDate() + '</span>' + chips + (evs.length > 2 ? '<div class="mmore">+' + (evs.length - 2) + '</div>' : '') + '</div>';
  }
  return '<div class="app' + (narrow ? ' narrow' : '') + '"><div class="app-tabs"><span>개인</span><span class="on">과제</span><span>근태</span></div><div class="app-main">'
    + '<aside class="app-side"><b>과제</b>' + ORDER.map(p => '<label class="pr"><input type="checkbox" checked><i style="background:' + P[p].color + '"></i><span>' + esc(P[p].name) + '</span></label>').join('') + '</aside>'
    + '<div class="app-cal"><div class="app-calh"><b>2026년 10월</b></div><div class="app-wk">' + [...DOW].map(c => '<span>' + c + '</span>').join('') + '</div>'
    + '<div class="app-grid">' + cells + '</div></div></div></div>';
}
/* 앱 pcPlacePop 과 같은 규칙: 칸 아래, 넘치면 위, 그래도 넘치면 화면 안으로 */
function placePop(scene){
  const pop = scene.querySelector('.anchored'), cell = scene.querySelector('.app-cell.sel');
  const sr = scene.getBoundingClientRect(), cr = cell.getBoundingClientRect();
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = cr.left - sr.left - 16, top = cr.bottom - sr.top + 6;
  if(top + h > sr.height - 8) top = cr.top - sr.top - h - 6;
  if(top < 8) top = Math.max(8, sr.height - h - 8);
  left = Math.max(8, Math.min(sr.width - w - 8, left));
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}

/* ===== 페이지 ===== */
const pair = html => '<div class="pair"><div class="stage">' + html + '</div><div class="stage dk">' + html + '</div></div>';
let out = SCENES.map((sc, i) => '<section class="card' + (i === 6 ? ' wide' : '') + '"><h2>' + esc(sc.t) + '</h2>'
  + (i === 1 ? '<p class="why">한 과제뿐이어도 과제 이름은 줄 위 묶음 머리에 한 번 둔다. 날마다 같은 자리에 있어 모양이 바뀌지 않고, 긴 과제 이름이 날짜 머리의 등록 단추와 다투지 않는다.</p>' : '')
  + pair(dayPop(sc)) + '</section>').join('');
const busy = SCENES[0];
const desk = mode => '<div class="scene desk' + (mode ? ' dk' : '') + '">' + calendarHtml(false) + '<div class="anchored">' + dayPop(busy) + '</div></div>';
const mob = mode => '<div class="scene mob' + (mode ? ' dk' : '') + '">' + calendarHtml(true) + '<div class="dimmer"></div><div class="sheet">' + dayPop(busy) + '</div></div>';
out += '<section class="card wide"><h2>375px 하단 시트(760px 이하)</h2><p class="why">시트는 화면 높이의 84%까지. 날짜 머리는 고정, 아래만 스크롤.</p><div class="scenes">' + mob(0) + mob(1) + '</div></section>';
out += '<section class="card wide"><h2>달력 위치: 30일 칸을 누른 모습(위젯 880px)</h2><p class="why">위치 규칙은 지금 앱(pcPlacePop)과 같다.</p><p class="lbl">라이트</p>' + desk(0) + '<p class="lbl" style="margin-top:12px">다크</p>' + desk(1) + '</section>';
document.getElementById('grid').innerHTML = out;
document.querySelectorAll('.scene.desk').forEach(placePop);

/* 시늉 */
let tt = 0;
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 1500); }
document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if(!b) return;
  if(b.hasAttribute('data-open')) toast('상세 창이 열립니다(현행 그대로)');
  else if(b.hasAttribute('data-new')) toast('등록 창이 열립니다(이 날짜)');
});
</script>
