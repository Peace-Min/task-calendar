(()=>{
const root=document.getElementById('tc-original-proposal'),q=s=>root.querySelector(s),qa=s=>[...root.querySelectorAll(s)];
const today='2026-10-22',cats=[{id:'product',name:'검사 시스템',token:'var(--tc-accent)'},{id:'ops',name:'운영 지원',token:'var(--tc-green)'},{id:'personal',name:'개인 업무',token:'var(--tc-gold)'}];
const events=[{id:'e1',type:'event',title:'API 연동 협의',cat:'product',start:'2026-10-22',time:'10:30',endTime:'11:30',place:'회의실 A',note:'오류 응답 규격과 연동 일정 확인'},{id:'e2',type:'event',title:'운영 점검',cat:'ops',start:'2026-10-22',time:'15:00',endTime:'15:30',note:'점검 결과 공유'},{id:'e3',type:'event',title:'고객 시연',cat:'product',start:'2026-10-23',time:'14:00',endTime:'15:00',note:'시험 결과와 시연 시나리오 확인'},{id:'e4',type:'event',title:'주간 업무 공유',cat:'product',start:'2026-10-19',time:'09:30',endTime:'10:00',note:''},{id:'e5',type:'event',title:'설계 리뷰',cat:'product',start:'2026-10-20',time:'14:00',endTime:'15:00',note:''},{id:'e6',type:'event',title:'월간 운영 회의',cat:'ops',start:'2026-10-28',time:'15:00',endTime:'16:00',note:''}];
const todos=[{id:'t1',type:'todo',title:'검사 UI 구현',cat:'product',start:'2026-10-19',end:'2026-10-23',done:false,important:true,notes:{'2026-10-22':'목록 화면 완료. 오류 상태 처리 진행 중.'}},{id:'t2',type:'todo',title:'운영 매뉴얼 정리',cat:'ops',start:'2026-10-22',end:'2026-10-22',done:false,note:'변경된 복구 절차 반영'},{id:'t3',type:'todo',title:'시험 결과 제출',cat:'product',start:'2026-10-23',end:'2026-10-23',done:false,note:''},{id:'t4',type:'todo',title:'로그 정리 방식 검토',cat:'ops',start:'',end:'',done:false,note:''},{id:'t5',type:'todo',title:'테스트 데이터 준비',cat:'product',start:'2026-10-21',end:'2026-10-22',done:true,completed:today,note:'시연용 데이터 준비 완료.'}];
const commits=[{id:'g1',title:'오류 응답 처리 및 목록 조회 개선',cat:'product',date:today,time:'11:42',hash:'a84f2c1',note:'빈 응답 안내와 재시도 처리 추가'},{id:'g2',title:'운영 점검 스크립트 정리',cat:'ops',date:today,time:'16:10',hash:'c72d0f4',note:'로그 보관 기간 설정 분리'}];
let mode='all',panel='detail',selected=today,month=9,year=2026,filter='',panelFilter='',showDone=false,importantOnly=false,focusId=null,editing=null,draftType='event',lastFocus=null;
let panelOpen=window.matchMedia?!window.matchMedia('(max-width:760px)').matches:true,previewId=null,previewAnchor=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cat=id=>cats.find(x=>x.id===id),color=id=>cat(id)?.token||'var(--tc-accent)',dateLabel=d=>{const x=new Date(d+'T12:00:00Z');return (x.getUTCMonth()+1)+'월 '+x.getUTCDate()+'일';},short=d=>d?Number(d.slice(5,7))+'/'+Number(d.slice(8)):'기한 없음';
const onDay=(x,d)=>!!x.start&&x.start<=d&&(x.end||x.start)>=d;
const icon=name=>'<i data-lucide="'+name+'" aria-hidden="true"></i>';
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function saveState(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{calendarView:mode,panel,selectedDate:selected,showCompleted:showDone,panelOpen},privateContent:{year,month,filter,panelFilter}}).catch(()=>{});}
function restore(s){const m=s?.modelContent||{},p=s?.privateContent||{};if(['all','event','todo'].includes(m.calendarView))mode=m.calendarView;if(['detail','todo','git'].includes(m.panel))panel=m.panel;if(/^\d{4}-\d{2}-\d{2}$/.test(m.selectedDate||''))selected=m.selectedDate;showDone=!!m.showCompleted;if(Number.isInteger(p.year)&&p.year>=1900&&p.year<=2200)year=p.year;if(Number.isInteger(p.month)&&p.month>=0&&p.month<12)month=p.month;if(cats.some(c=>c.id===p.filter))filter=p.filter;if(cats.some(c=>c.id===p.panelFilter))panelFilter=p.panelFilter;}
function filterMarkup(local=false){const active=local?panelFilter:filter,attr=local?'data-pcat':'data-cat';return '<span class="tc-label">'+(local?'과제:':'과제 필터:')+'</span><button class="tc-pill" type="button" '+attr+'="" aria-pressed="'+(!active)+'">전체</button>'+cats.map(c=>'<button class="tc-pill" type="button" '+attr+'="'+c.id+'" aria-pressed="'+(active===c.id)+'" style="--tc-cat:'+c.token+'"><span class="tc-dot"></span>'+c.name+'</button>').join('');}
function render(){
 root.dataset.panelOpen=String(panelOpen);root.dataset.sheet=String(panelOpen);q('[data-togglepanel]').textContent=panelOpen?'패널 접기 ›':'‹ 패널 펼치기';q('[data-togglepanel]').setAttribute('aria-expanded',String(panelOpen));q('#tc-access-date').textContent=dateLabel(selected);closePreview();
 q('.tc-month').textContent=year+'년 '+(month+1)+'월';q('#tc-projectfilters').innerHTML=filterMarkup();
 qa('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(mode===b.dataset.view)));qa('[data-panel]').forEach(b=>b.setAttribute('aria-pressed',String(panel===b.dataset.panel)));q('#tc-done').checked=showDone;q('.tc-completed').hidden=mode==='event';
 const first=new Date(Date.UTC(year,month,1)),base=first.getTime()-first.getUTCDay()*86400000,days=new Date(Date.UTC(year,month+1,0)).getUTCDate(),weeks=Math.ceil((first.getUTCDay()+days)/7);
 const gridItems=[...events,...todos].filter(x=>(!filter||x.cat===filter)&&(mode==='all'||x.type===mode)&&(x.type!=='todo'||showDone||!x.done));let html='';
 for(let w=0;w<weeks;w++){
 const dates=Array.from({length:7},(_,i)=>new Date(base+(w*7+i)*86400000).toISOString().slice(0,10));
 const ranges=gridItems.filter(x=>x.type==='todo'&&x.end>x.start&&x.start<=dates[6]&&x.end>=dates[0]);
 html+='<div class="tc-week">'+dates.map((d,i)=>{
 const off=Number(d.slice(5,7))!==month+1;let s='<div class="tc-cell '+(i===0?'tc-sun ':i===6?'tc-sat ':'')+(off?'tc-out ':'')+(d===today?'tc-today ':'')+(d===selected?'tc-selected':'')+'" data-cell="'+d+'"><div class="tc-celltop"><button type="button" class="tc-date" data-date="'+d+'" aria-label="'+d+' 선택" '+(d===today?'aria-current="date"':'')+'>'+Number(d.slice(8))+'</button>'+(d==='2026-10-03'?'<span class="tc-holiday">개천절</span>':d==='2026-10-09'?'<span class="tc-holiday">한글날</span>':'')+'</div>';
 for(const x of ranges){if(onDay(x,d)){const cls=(d===x.start||i===0)?'tc-start':(d===x.end||i===6)?'tc-end':'tc-middle';s+=chip(x,'tc-taskchip tc-range '+cls);}else s+='<div class="tc-spacer"></div>';}
 s+=gridItems.filter(x=>onDay(x,d)&&!(x.type==='todo'&&x.end>x.start)).map(x=>chip(x,x.type==='todo'?'tc-taskchip':'tc-eventchip')).join('');return s+'</div>';
 }).join('')+'</div>';
 }
 q('#tc-grid').innerHTML=html;q('#tc-grid').setAttribute('aria-label',year+'년 '+(month+1)+'월 달력');renderPanel();
 q('#tc-status').textContent='달력: '+({all:'전체',event:'일정만',todo:'할 일만'}[mode])+' · '+(panelOpen?'패널 펼침':'패널 접힘 · 항목 클릭으로 미리보기')+' · 시안 변경은 새로고침 시 초기화됩니다.';icons();
}
function chip(x,cls){return '<button type="button" class="tc-chip '+cls+(x.done?' tc-done':'')+'" data-item="'+x.id+'" style="--tc-cat:'+color(x.cat)+'" data-tooltip="'+esc(x.title+(x.time?' · '+x.time:'')+(x.end>x.start?' · '+short(x.start)+'–'+short(x.end):''))+'"><span class="tc-chiptitle">'+(x.important?'★ ':'')+esc(x.title)+'</span></button>';}
function renderPanel(){
 const d=new Date(selected+'T12:00:00Z'),header='<div class="tc-panelhead"><div><div class="tc-paneldate">'+dateLabel(selected)+'<span class="tc-dow">'+['일','월','화','수','목','금','토'][d.getUTCDay()]+'요일</span></div>';
 const list=events.filter(x=>onDay(x,selected)&&(!filter||x.cat===filter));let body='';
 if(panel==='detail')body=header+'<div class="tc-meta">'+list.length+'개의 기록'+(filter?' (과제 필터 적용)':'')+'</div></div><button type="button" class="tc-primary tc-small" data-add="event">＋ 추가</button></div><div class="tc-cards">'+(list.length?list.map(card).join(''):'<div class="tc-empty">이 날짜에는 일정이 없습니다.</div>')+'</div>';
 else{
 body='<div class="tc-panel-filter">'+filterMarkup(true)+'</div><div class="tc-todopad">';
 if(panel==='todo'){
 body+='<div class="tc-todotools"><button class="tc-primary tc-small" type="button" data-add="todo">＋ 할 일 추가</button><button class="tc-small" type="button" data-important aria-pressed="'+importantOnly+'">★ 중요만</button></div><div class="tc-meta">'+selected+' 할 일</div>';
 const base=todos.filter(x=>(!panelFilter||x.cat===panelFilter)&&(!importantOnly||x.important));
 const active=base.filter(x=>!x.done&&onDay(x,selected)),nodate=base.filter(x=>!x.done&&!x.start),done=base.filter(x=>x.done&&onDay(x,selected));
 body+=todoSection('이 날',active)+todoSection('기한 없음',nodate)+todoSection('완료',done);
 }else{
 const cs=commits.filter(x=>x.date===selected&&(!panelFilter||x.cat===panelFilter));body+='<div class="tc-meta">'+selected+' 커밋 내역</div>'+cs.map(x=>'<div class="tc-todo" style="--tc-cat:'+color(x.cat)+'"><div class="tc-todobody"><div class="tc-todometa">'+x.time+' · '+cat(x.cat).name+' · '+x.hash+'</div><div class="tc-cardtitle" style="margin-top:6px">'+esc(x.title)+'</div><div class="tc-note">'+esc(x.note)+'</div></div></div>').join('')+(cs.length?'':'<div class="tc-empty">이 날짜에는 커밋이 없습니다.</div>');
 }body+='</div>';
 }
 q('#tc-panelbody').innerHTML=body;if(focusId){const el=q('[data-row="'+focusId+'"]');if(el)el.classList.add('tc-focused');}icons();
}
function card(x){return '<article class="tc-card" data-row="'+x.id+'" style="--tc-cat:'+color(x.cat)+'"><span class="tc-badge">'+cat(x.cat).name+'</span><div class="tc-cardtitle">'+esc(x.title)+'</div><div class="tc-when">'+icon('clock-3')+(x.time?x.time+(x.endTime?'–'+x.endTime:''):'종일')+'</div>'+(x.place?'<div class="tc-when">'+icon('map-pin')+esc(x.place)+'</div>':'')+(x.note?'<div class="tc-note">'+esc(x.note)+'</div>':'')+'<div class="tc-cardactions"><button type="button" class="tc-link" data-edit="'+x.id+'">수정</button><button type="button" class="tc-link tc-delete" data-delete="'+x.id+'">삭제</button></div></article>';}
function todoSection(name,list){return '<div class="tc-sectiontitle">'+name+' <span>'+list.length+'</span></div>'+list.map(x=>'<div class="tc-todo" data-row="'+x.id+'" style="--tc-cat:'+color(x.cat)+'"><input type="checkbox" data-check="'+x.id+'" aria-label="'+esc(x.title)+' 완료" '+(x.done?'checked':'')+'><div class="tc-todobody"><button type="button" class="tc-link tc-todotitle '+(x.done?'tc-done':'')+'" data-edit="'+x.id+'">'+esc(x.title)+'</button><div class="tc-todometa"><span class="tc-dot"></span>'+cat(x.cat).name+' · '+(x.end>x.start?short(x.start)+'–'+short(x.end):x.start===today?'오늘':short(x.start))+'</div>'+((x.notes?.[selected]||x.note)?'<div class="tc-note">'+esc(x.notes?.[selected]||x.note)+'</div>':'')+'</div><button type="button" class="tc-star" data-star="'+x.id+'" aria-label="'+esc(x.title)+' 중요 표시" aria-pressed="'+!!x.important+'">'+(x.important?'★':'☆')+'</button></div>').join('')+(list.length?'':'<div class="tc-meta">없음</div>');}
function closePreview(){previewId=null;previewAnchor=null;q('#tc-preview').hidden=true;}
function showPreview(x,anchor){
 previewId=x.id;previewAnchor=anchor;const el=q('#tc-preview');
 el.innerHTML='<div class="tc-previewhead"><div><span class="tc-badge" style="--tc-cat:'+color(x.cat)+'">'+cat(x.cat).name+' · '+(x.type==='todo'?'할 일':'일정')+'</span><div class="tc-cardtitle">'+esc(x.title)+'</div></div><button type="button" data-closepreview aria-label="미리보기 닫기">×</button></div><div class="tc-meta">'+short(x.start)+(x.end>x.start?'–'+short(x.end):'')+(x.time?' · '+x.time+(x.endTime?'–'+x.endTime:''):'')+'</div>'+(x.place?'<div class="tc-meta">'+esc(x.place)+'</div>':'')+'<div class="tc-previewnote">'+esc(x.notes?.[selected]||x.note||'')+'</div>'+(x.type==='todo'?'<label class="tc-completed" style="margin:8px 0"><input type="checkbox" data-previewcheck="'+x.id+'" '+(x.done?'checked':'')+'>완료 처리'+(x.done?' · '+short(x.completed):'')+'</label>':'')+'<div class="tc-previewactions"><button type="button" class="tc-primary" data-fulldetail="'+x.id+'">상세 보기</button><button type="button" data-previewpanel="'+x.id+'">패널에서 보기</button></div>';
 el.hidden=false;const r=root.getBoundingClientRect(),a=anchor.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;
 el.style.left=Math.max(8,Math.min(a.left-r.left,r.width-w-8))+'px';const below=a.bottom-r.top+7;el.style.top=Math.max(8,Math.min(below,r.height-h-8))+'px';icons();
}
function fullDetail(x){closePreview();openDialog(x.title,'<span class="tc-badge" style="--tc-cat:'+color(x.cat)+'">'+cat(x.cat).name+' · '+(x.type==='todo'?'할 일':'일정')+'</span><div class="tc-meta">'+(x.end>x.start?'작업 기간 ':'')+short(x.start)+(x.end>x.start?'–'+short(x.end):'')+(x.time?' · '+x.time+(x.endTime?'–'+x.endTime:''):'')+'</div>'+(x.place?'<div class="tc-meta">장소 · '+esc(x.place)+'</div>':'')+(x.done?'<div class="tc-meta">실제 완료일 · '+short(x.completed)+'</div>':'')+'<div class="tc-note" style="margin-top:14px">'+esc(x.notes?.[selected]||x.note||'메모 없음')+'</div><div class="tc-dialogactions"><button type="button" data-edit="'+x.id+'">수정</button><button type="button" class="tc-primary" data-previewpanel="'+x.id+'">패널에서 보기</button></div>');}
function openDialog(title,body){lastFocus=document.activeElement;closePreview();q('#tc-dialogtitle').textContent=title;q('#tc-dialogbody').innerHTML=body;q('#tc-overlay').hidden=false;q('#tc-dialogbody input, #tc-dialogbody button, [data-close]')?.focus();icons();}
function closeDialog(){q('#tc-overlay').hidden=true;lastFocus?.focus();editing=null;}
function openForm(type,id){editing=id||null;const x=[...events,...todos].find(x=>x.id===id);draftType=x?.type||type||'event';renderForm(x);}
function renderForm(x){
const type=draftType;openDialog(x?'기록 수정':'새 기록','<div class="tc-seg" aria-label="기록 종류"><button type="button" data-formtype="event" aria-pressed="'+(type==='event')+'">일정</button><button type="button" data-formtype="todo" aria-pressed="'+(type==='todo')+'">할 일</button></div><form id="tc-form"><div class="tc-fields"><label class="tc-field tc-wide">제목<input id="tc-titleinput" required maxlength="200" value="'+esc(x?.title||'')+'" placeholder="제목을 입력하세요"></label><label class="tc-field">'+(type==='event'?'날짜':'기한 / 시작일')+'<input id="tc-dateinput" type="date" value="'+(x?.start??selected)+'" '+(type==='event'?'required':'')+'></label><label class="tc-field">과제<select id="tc-catinput">'+cats.map(c=>'<option value="'+c.id+'" '+((x?.cat||filter||cats[0].id)===c.id?'selected':'')+'>'+c.name+'</option>').join('')+'</select></label>'+(type==='event'?'<label class="tc-field">시작 시각<input id="tc-timeinput" type="time" value="'+(x?.time||'')+'"></label><label class="tc-field">종료 시각<input id="tc-endtimeinput" type="time" value="'+(x?.endTime||'')+'"></label><label class="tc-field tc-wide">장소<input id="tc-placeinput" value="'+esc(x?.place||'')+'"></label>':'<label class="tc-field tc-wide">기간 종료일 (선택)<input id="tc-endinput" type="date" value="'+(x?.end||'')+'"></label>')+'<label class="tc-field tc-wide">'+(x?.notes?'선택 날짜의 메모 · '+short(selected):'메모')+'<textarea id="tc-noteinput">'+esc(x?.notes?.[selected]??x?.note??'')+'</textarea></label></div><div class="tc-error" role="alert" id="tc-formerror"></div><div class="tc-dialogactions"><button type="button" data-close>취소</button><button type="submit" class="tc-primary">'+(x?'저장':'추가')+'</button></div></form>');
}
function select(d){selected=d;focusId=null;render();saveState();}
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b){const cell=e.target.closest('[data-cell]');if(cell)select(cell.dataset.cell);return;}
 if(b.dataset.view){mode=b.dataset.view;focusId=null;render();saveState();}
 else if(b.hasAttribute('data-togglepanel')){panelOpen=!panelOpen;render();saveState();}
 else if(b.dataset.openpanel){panel=b.dataset.openpanel;panelOpen=true;focusId=null;render();saveState();}
 else if(b.hasAttribute('data-closepreview'))closePreview();
 else if(b.dataset.fulldetail){fullDetail([...events,...todos].find(x=>x.id===b.dataset.fulldetail));}
 else if(b.dataset.previewpanel){const x=[...events,...todos].find(x=>x.id===b.dataset.previewpanel);panel=x.type==='todo'?'todo':'detail';panelFilter='';focusId=x.id;panelOpen=true;closeDialog();render();saveState();}
 else if(b.dataset.panel){panel=b.dataset.panel;focusId=null;render();saveState();}
 else if(b.hasAttribute('data-sheetclose')){panelOpen=false;render();saveState();}
 else if(b.hasAttribute('data-cat')){filter=b.dataset.cat;render();saveState();}
 else if(b.hasAttribute('data-pcat')){panelFilter=b.dataset.pcat;render();saveState();}
 else if(b.dataset.date)select(b.dataset.date);
 else if(b.dataset.move){const d=new Date(Date.UTC(year,month+Number(b.dataset.move),1));year=d.getUTCFullYear();month=d.getUTCMonth();render();saveState();}
 else if(b.hasAttribute('data-today')){year=2026;month=9;select(today);}
 else if(b.dataset.item){const x=[...events,...todos].find(x=>x.id===b.dataset.item);selected=b.closest('[data-cell]').dataset.cell;if(panelOpen){panel=x.type==='todo'?'todo':'detail';if(panel==='todo')panelFilter='';focusId=x.id;render();}else{qa('.tc-cell').forEach(c=>c.classList.toggle('tc-selected',c.dataset.cell===selected));q('#tc-access-date').textContent=dateLabel(selected);showPreview(x,b);}saveState();}
 else if(b.dataset.edit)openForm(null,b.dataset.edit);
 else if(b.hasAttribute('data-new')||b.dataset.add)openForm(b.dataset.add||'event');
 else if(b.hasAttribute('data-close'))closeDialog();
 else if(b.dataset.formtype){const old={...([ ...events,...todos].find(x=>x.id===editing)||{}),title:q('#tc-titleinput').value,start:q('#tc-dateinput').value,cat:q('#tc-catinput').value,note:q('#tc-noteinput').value};draftType=b.dataset.formtype;renderForm(old);}
 else if(b.dataset.star){const x=todos.find(x=>x.id===b.dataset.star);x.important=!x.important;render();}
 else if(b.hasAttribute('data-important')){importantOnly=!importantOnly;render();}
 else if(b.dataset.delete){const x=events.find(x=>x.id===b.dataset.delete);openDialog('일정 삭제','<p>'+esc(x.title)+' 일정을 삭제할까요?</p><div class="tc-dialogactions"><button type="button" data-close>취소</button><button type="button" class="tc-primary" data-confirmdelete="'+x.id+'">삭제</button></div>');}
 else if(b.dataset.confirmdelete){events.splice(events.findIndex(x=>x.id===b.dataset.confirmdelete),1);closeDialog();render();}
 else if(b.hasAttribute('data-jump'))openDialog('연·월 이동','<form id="tc-jumpform"><label class="tc-field">연·월<input type="month" id="tc-jumpinput" value="'+year+'-'+String(month+1).padStart(2,'0')+'" required></label><div class="tc-dialogactions"><button type="submit" class="tc-primary">이동</button></div></form>');
 else if(b.hasAttribute('data-search'))openDialog('검색','<label class="tc-field">제목·메모·과제<input id="tc-searchinput" placeholder="검색어 입력"></label><div id="tc-searchresults" class="tc-cards"></div>');
 else if(b.dataset.result){const x=[...events,...todos].find(x=>x.id===b.dataset.result);closeDialog();panel=x.type==='todo'?'todo':'detail';selected=x.start||today;year=Number(selected.slice(0,4));month=Number(selected.slice(5,7))-1;focusId=x.id;render();}
 else if(b.hasAttribute('data-theme')){root.style.colorScheme=root.style.colorScheme==='dark'?'light':'dark';}
 else if(b.hasAttribute('data-report')){const ts=todos.filter(x=>(!filter||x.cat===filter)&&((x.start&&x.start<='2026-10-25'&&(x.end||x.start)>='2026-10-19')||(x.completed>='2026-10-19'&&x.completed<='2026-10-25')));openDialog('주간보고 미리보기 · 가상 데이터','<div class="tc-meta">2026-10-19 – 2026-10-25</div>'+ts.map(x=>'<div class="tc-todo"><div><span class="tc-badge" style="--tc-cat:'+color(x.cat)+'">'+cat(x.cat).name+'</span><div>'+esc(x.title)+(x.done?' · 완료':'')+'</div><div class="tc-note">'+esc(x.notes?.[today]||x.note||'')+'</div></div></div>').join(''));}
 else if(b.dataset.info){const content={projects:['내 과제',cats.map(c=>'<p><span class="tc-dot" style="--tc-cat:'+c.token+'"></span> '+c.name+'</p>').join('')],peer:['다른 사람 일정','<p>개인 캘린더 보기 전환을 검토하는 시안입니다. 다른 구성원의 데이터는 포함하지 않았습니다.</p>'],feedback:['문의','<p>수행과제 캘린더 · 버그 및 개선사항 문의</p>'],user:['사용자 정보','<p>검토용 사용자 · 가상 계정</p>'],help:['사용 방법','<p>상단의 전체·일정·할 일은 달력 표시만 바꿉니다.</p><p>날짜를 누르면 우측 패널의 기준 날짜가 바뀝니다. 칩을 누르면 해당 항목의 우측 탭을 엽니다.</p><p>날짜를 더블클릭하면 새 기록을 입력할 수 있습니다.</p>'],more:['더보기','<p>설정 · 데이터 내보내기 · 앱 업데이트 등 기존 메뉴의 위치입니다.</p><p>이 시안은 달력 보기와 우측 패널의 관계를 검토하는 범위입니다.</p>']}[b.dataset.info];openDialog(...content);}
});
root.addEventListener('dblclick',e=>{const cell=e.target.closest('[data-cell]');if(cell&&!e.target.closest('[data-item]')){selected=cell.dataset.cell;openForm(mode==='todo'?'todo':'event');}});
root.addEventListener('change',e=>{if(e.target.id==='tc-done'){showDone=e.target.checked;render();saveState();}else if(e.target.dataset.previewcheck){const x=todos.find(x=>x.id===e.target.dataset.previewcheck),d=selected;x.done=e.target.checked;x.completed=x.done?today:'';render();showPreview(x,q('[data-cell="'+d+'"] [data-item="'+x.id+'"]')||q('[data-date="'+d+'"]'));}else if(e.target.dataset.check){const x=todos.find(x=>x.id===e.target.dataset.check);x.done=e.target.checked;x.completed=x.done?today:'';render();}});
root.addEventListener('input',e=>{if(e.target.id==='tc-searchinput'){const term=e.target.value.trim().toLowerCase();const matches=[...events,...todos].filter(x=>term&&(x.title+' '+(x.note||'')+' '+cat(x.cat).name).toLowerCase().includes(term));q('#tc-searchresults').innerHTML=matches.map(x=>'<button type="button" class="tc-link" data-result="'+x.id+'">'+short(x.start)+' · '+esc(x.title)+'</button>').join('')||'<div class="tc-meta">'+(term?'검색 결과가 없습니다.':'검색어를 입력하세요.')+'</div>';}});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='tc-jumpform'){const [y,m]=q('#tc-jumpinput').value.split('-').map(Number);year=y;month=m-1;closeDialog();render();saveState();return;}if(e.target.id!=='tc-form')return;
 const start=q('#tc-dateinput').value,end=q('#tc-endinput')?.value||start,time=q('#tc-timeinput')?.value||'',endTime=q('#tc-endtimeinput')?.value||'';
 const error=(end&&!start)?'종료일을 입력하려면 시작일이 필요합니다.':(end&&end<start)?'종료일은 시작일보다 빠를 수 없습니다.':(endTime&&(!time||endTime<=time))?'종료 시각은 시작 시각보다 늦어야 합니다.':'';if(error){q('#tc-formerror').textContent=error;return;}
 const old=[...events,...todos].find(x=>x.id===editing),x={...(old||{}),id:old?.id||'new'+Date.now(),type:draftType,title:q('#tc-titleinput').value.trim(),cat:q('#tc-catinput').value,start,end,time,endTime,place:q('#tc-placeinput')?.value||'',note:q('#tc-noteinput').value};if(!x.title){q('#tc-formerror').textContent='제목을 입력하세요.';return;}if(old?.notes){x.notes={...old.notes,[selected]:x.note};x.note=old.note||'';}if(old){const source=old.type==='event'?events:todos;source.splice(source.indexOf(old),1);}if(x.type==='event')events.push(x);else todos.push(x);panel=x.type==='event'?'detail':'todo';focusId=x.id;closeDialog();render();});
q('#tc-overlay').addEventListener('click',e=>{if(e.target.id==='tc-overlay')closeDialog();});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!q('#tc-preview').hidden){e.preventDefault();const anchor=previewAnchor;closePreview();anchor?.focus();return;}if(q('#tc-overlay').hidden)return;if(e.key==='Escape'){e.preventDefault();closeDialog();}if(e.key==='Tab'){const els=[...q('#tc-overlay').querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled),first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
root.addEventListener('click',e=>{if(!e.target.closest('#tc-preview,[data-item]'))closePreview();});
restore(window.openai?.widgetState);if(typeof window.openai?.widgetState?.modelContent?.panelOpen==='boolean')panelOpen=window.openai.widgetState.modelContent.panelOpen;render();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){const s=e.detail.globals.widgetState;restore(s);if(typeof s.modelContent?.panelOpen==='boolean')panelOpen=s.modelContent.panelOpen;render();}});
if(globalThis.Tweak){const settings={followPanel:false};const tweak=new Tweak({container:root,onChange:()=>{if(settings.followPanel&&mode!=='all'){panel=mode==='todo'?'todo':'detail';render();}}});tweak.addToggle(settings,'followPanel',{label:'보기 변경 시 우측 탭도 맞추기'});root.addEventListener('click',e=>{if(e.target.closest('[data-view]')&&settings.followPanel&&mode!=='all'){panel=mode==='todo'?'todo':'detail';render();saveState();}});}
})();
</script>
