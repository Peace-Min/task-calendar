<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 과제 메뉴 시안</title>
<style>
:root{
  --bg:#f3f4f7; --panel:#ffffff; --line:#e4e7ee; --line-2:#d6dbe6;
  --text:#1d2433; --muted:#5b6373; --faint:#9aa1b0; --faint-text:#7a8293;
  --accent:#3e5be0; --accent-2:#2e44ad; --accent-soft:#eef1fd; --on-accent:#fff;
  --danger-text:#c0392b; --hover-bg:#f3f5fa;
  --shadow:0 10px 32px rgba(20,28,55,.16);
  --r-sm:6px; --r-md:8px; --r-lg:12px;
  --fs-body:13px; --fs-meta:12px; --fs-micro:11px; --fs-emph:14px; --fs-h2:16px;
}
*{box-sizing:border-box;margin:0}
body{background:#e9ebf0;color:var(--text);font-family:'Segoe UI','Malgun Gothic','맑은 고딕',system-ui,sans-serif;font-size:var(--fs-body);padding:20px 16px 40px}
button{font-family:inherit}
.page{max-width:1240px;margin:0 auto}
h1{font-size:18px;margin-bottom:4px}
.lead{color:var(--muted);margin-bottom:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:var(--fs-body);color:var(--text)}
.seg button + button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.lbl{color:var(--muted);font-size:var(--fs-meta);margin-left:6px}
.wrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.note{flex:1;min-width:280px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;line-height:1.6}
.note h2{font-size:15px;margin-bottom:6px}
.note .rec{display:inline-block;font-size:var(--fs-micro);font-weight:700;color:var(--accent-2);background:var(--accent-soft);border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:2px}
.note ul{padding-left:18px;margin:6px 0}
.note .good{color:#1e7a3e}
.note .bad{color:var(--danger-text)}
.note .try{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:var(--fs-meta)}

/* 위젯 창 흉내: 800x600 */
.win{position:relative;width:800px;height:600px;flex:none;background:var(--bg);border:1px solid var(--line-2);border-radius:6px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.win-bg{position:absolute;inset:0;padding:14px;color:var(--faint);font-size:var(--fs-meta)}
.win-bg .fake{height:30px;background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
.win-bg .grid{height:480px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.overlay{position:absolute;inset:0;background:rgba(18,23,42,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow);width:min(540px,100%);max-height:92%;display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line);flex:none}
.modal-head h3{font-size:var(--fs-h2)}
.x{border:none;background:transparent;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 7px;border-radius:var(--r-sm)}
.modal-body{padding:14px 20px 20px;overflow-y:auto;position:relative}

.cat-wrap{border:1px solid var(--line);border-radius:var(--r-md)}
.cat-head,.cat-row{display:grid;grid-template-columns:16px 12px minmax(0,1fr) 44px 44px 30px;align-items:center;column-gap:10px}
.cat-head{height:38px;padding:0 6px 0 8px;background:var(--bg);border-bottom:1px solid var(--line);border-radius:calc(var(--r-md) - 1px) calc(var(--r-md) - 1px) 0 0;font-size:var(--fs-meta);font-weight:600;color:var(--muted)}
.cat-head .n{text-align:right}
.cat-row{position:relative;min-height:40px;padding:6px 6px 6px 8px}
.cat-row + .cat-row{border-top:1px solid var(--line)}
.cat-row:hover{background:var(--hover-bg)}
.cat-grip{color:var(--faint);text-align:center;font-size:16px;line-height:1;user-select:none}
.cat-dot{width:12px;height:12px;border-radius:50%}
.cat-name{font-weight:600;font-size:var(--fs-emph);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-desc{font-size:var(--fs-meta);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-tag{font-size:var(--fs-micro);font-weight:600;padding:0 5px;border-radius:4px;color:var(--accent-2);background:var(--accent-soft);margin-left:6px}
.cat-count{text-align:right;font-size:var(--fs-meta);font-variant-numeric:tabular-nums}
.cat-more{border:1px solid transparent;background:none;border-radius:var(--r-sm);width:30px;height:28px;padding:0;cursor:pointer;font-size:16px;line-height:1;color:var(--muted)}
.cat-more:hover,.cat-more[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
.cat-add{position:sticky;bottom:0;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:42px;margin-top:10px;border:1.5px dashed var(--accent);border-radius:var(--r-md);background:var(--panel);color:var(--accent-2);font-weight:700;cursor:pointer;box-shadow:0 -10px 12px -8px var(--panel),0 24px 0 0 var(--panel)}

/* 메뉴 공통 */
.cat-menu{z-index:8;min-width:220px;padding:4px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:var(--shadow)}
.cat-menu [role="menuitem"]{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:var(--r-sm);cursor:pointer;font-size:var(--fs-body);color:var(--text)}
.cat-menu [role="menuitem"]:hover:not(:disabled){background:var(--hover-bg)}
.cat-menu [role="menuitem"]:disabled{color:var(--faint-text);cursor:default}
.cat-menu [role="menuitem"].danger{color:var(--danger-text)}
.cat-menu-grp{font-size:var(--fs-micro);color:var(--faint-text);padding:6px 10px 2px}
.cat-menu-sep{height:1px;background:var(--line);margin:4px 2px}
/* 현행: 줄 안에 absolute */
.m-cur{position:absolute;right:6px;top:calc(100% - 2px)}
.m-cur.up{top:auto;bottom:calc(100% - 2px)}
/* A, B: 창(화면) 기준. 시안에서는 .win 을 화면으로 본다(앱에서는 position:fixed) */
.m-float{position:absolute;z-index:20;max-height:calc(100% - 16px);overflow-y:auto}
/* B: 순서 한 줄 */
.ord{display:flex;align-items:center;gap:4px;padding:2px 6px 4px}
.ord span{font-size:var(--fs-meta);color:var(--muted);margin-right:auto;padding-left:4px}
.ord button{width:34px;height:28px;border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r-sm);cursor:pointer;font-size:14px;color:var(--text)}
.ord button:hover:not(:disabled){background:var(--hover-bg)}
.ord button:disabled{color:var(--faint);cursor:default;background:var(--bg)}
/* C: 줄 아래 펼침 */
.cat-acts{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 2px 38px}
.cat-acts button{border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r-sm);padding:4px 10px;cursor:pointer;font-size:var(--fs-meta);color:var(--text)}
.cat-acts button:hover:not(:disabled){background:var(--hover-bg)}
.cat-acts button:disabled{color:var(--faint);cursor:default}
.cat-acts button.danger{color:var(--danger-text)}
.cat-acts .gap{width:8px}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:6px 12px;border-radius:6px;font-size:var(--fs-meta);opacity:0;transition:opacity .15s;pointer-events:none;z-index:30}
.toast.on{opacity:.92}
@media (max-width:860px){.win{transform:scale(.45);transform-origin:top left;margin-bottom:-330px;margin-right:-440px}}
</style>
</head>
<body>
<div class="page">
  <h1>내 과제 ⋯ 메뉴 잘림 (피드백 2번) 시안</h1>
  <p class="lead">오른쪽 창은 위젯 기본 크기(800x600)입니다. 안 하나를 고르고 줄의 ⋯ 를 눌러 보세요. 과제 수를 바꾸면 위, 아래 자리가 모자란 경우도 볼 수 있습니다.</p>
  <div class="bar">
    <div class="seg" id="segMode" role="group" aria-label="안">
      <button data-v="cur" aria-pressed="true">현행</button>
      <button data-v="a" aria-pressed="false">A안</button>
      <button data-v="b" aria-pressed="false">B안</button>
      <button data-v="c" aria-pressed="false">C안</button>
    </div>
    <span class="lbl">과제 수</span>
    <div class="seg" id="segRows" role="group" aria-label="과제 수">
      <button data-v="1" aria-pressed="false">1개</button>
      <button data-v="4" aria-pressed="true">4개</button>
      <button data-v="12" aria-pressed="false">12개</button>
    </div>
  </div>
  <div class="wrap">
    <div class="win" id="win">
      <div class="win-bg"><div class="fake"></div><div class="fake"></div><div class="grid"></div></div>
      <div class="overlay">
        <div class="modal" role="dialog" aria-label="내 과제">
          <div class="modal-head"><h3>내 과제</h3><button class="x" aria-label="닫기">×</button></div>
          <div class="modal-body" id="body">
            <div class="cat-wrap" id="list"></div>
            <button class="cat-add" type="button">+ 과제 추가</button>
          </div>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<script>
const NOTES = {
  cur: `<h2>현행</h2>
    <p>메뉴가 줄 안에 붙어 있어 창 본문(스크롤 칸)을 벗어나지 못합니다.</p>
    <ul><li class="bad">본문에 스크롤 막대가 생기고 메뉴 아래가 잘립니다.</li>
    <li class="bad">위로 뒤집는 조건이 "줄 위쪽에 메뉴 높이만큼 자리"라서 과제가 적으면 늘 아래로 열립니다.</li></ul>
    <p class="try">4개에서 둘째 줄 ⋯ 를 누르면 피드백 그대로입니다.</p>`,
  a: `<h2>A안. 메뉴를 창 위에 띄우기<span class="rec">추천</span></h2>
    <p>메뉴 항목과 모양은 그대로 두고, 메뉴를 창 본문 밖(화면 기준)에 띄웁니다.</p>
    <ul><li class="good">내 과제 창 밖으로 넘어가도 보이므로 잘리지 않고 스크롤 막대도 안 생깁니다.</li>
    <li class="good">아래 자리가 모자라면 ⋯ 위로, 위아래 다 모자라면 화면 안으로 밀어 넣습니다.</li>
    <li>목록을 스크롤하거나 창 크기가 바뀌면 메뉴는 닫힙니다(⋯ 와 떨어지지 않게).</li>
    <li class="good">고칠 곳이 메뉴 띄우는 함수 하나라 위험이 가장 작습니다.</li></ul>
    <p class="try">다른 화면의 팝업(과제 고르기, 날짜 목록)도 같은 방식으로 띄웁니다.</p>`,
  b: `<h2>B안. A안 + 메뉴 줄이기</h2>
    <p>A안처럼 띄우고, 순서 4개(위로, 아래로, 맨 위로, 맨 아래로)를 한 줄 단추로 묶어 메뉴 높이를 줄입니다.</p>
    <ul><li class="good">메뉴가 약 140px 짧아져 작은 창에서도 ⋯ 바로 아래에 다 들어갑니다.</li>
    <li class="bad">단추가 기호(↑ ↓ ⤒ ⤓)라 글자 메뉴보다 뜻이 덜 바로 읽힙니다(마우스를 올리면 이름).</li>
    <li>순서 바꾸기는 넓은 창에서는 ⠿ 끌기가 있어 메뉴에서 자주 쓰지 않습니다.</li></ul>`,
  c: `<h2>C안. 줄 아래에 단추 줄 펼치기</h2>
    <p>떠 있는 메뉴 대신 그 줄 아래가 열리며 단추가 한 줄로 나옵니다.</p>
    <ul><li class="good">떠 있는 것이 없어 잘림 문제가 아예 없습니다.</li>
    <li class="bad">열 때마다 아래 줄들이 밀려 내려갑니다(출렁이는 화면).</li>
    <li class="bad">단추가 많아 좁은 창에서 두 줄이 됩니다.</li></ul>`
};
const BASE = [
  { name:'[샘플] 프로젝트 A', desc:'초기 설치 예시 과제입니다. 자유롭게 수정하세요.', color:'#3e5be0', ev:2, td:4, kind:'personal', data:true },
  { name:'[샘플] 운영 업무', desc:'초기 설치 예시 과제입니다. 자유롭게 수정하세요.', color:'#2e9e5b', ev:1, td:2, kind:'personal', data:true },
  { name:'휴가', desc:'', color:'#2e9e5b', ev:0, td:0, kind:'personal', data:false },
  { name:'기타', desc:'', color:'#5b6373', ev:0, td:0, kind:'personal', data:false }
];
const EXTRA = 'BCDEFGHI'.split('').map((c, i) => ({ name:'과제 ' + c, desc: i % 2 ? '' : '예시 공식 과제', color:['#c0392b','#8e44ad','#d68910','#16a085'][i % 4], ev:i, td:i + 1, kind: i % 2 ? 'personal' : 'official', data: i > 0 }));
let mode = 'cur', nRows = 4, cats = [], menu = null;
const $ = s => document.querySelector(s);
const win = $('#win'), body = $('#body'), list = $('#list');

function build(){
  cats = nRows === 1 ? [BASE[0]] : nRows === 4 ? BASE.slice() : BASE.concat(EXTRA);
  closeMenu();
  list.innerHTML = '<div class="cat-head"><span></span><span></span><span>과제</span><span class="n">일정</span><span class="n">할 일</span><span></span></div>'
    + cats.map((c, i) => `<div class="cat-row" data-i="${i}"><span class="cat-grip">⠿</span><span class="cat-dot" style="background:${c.color}"></span>`
      + `<div style="min-width:0"><div class="cat-name">${c.name}${c.kind === 'official' ? '<span class="cat-tag">공식</span>' : ''}</div>${c.desc ? `<div class="cat-desc">${c.desc}</div>` : ''}</div>`
      + `<span class="cat-count">${c.ev}</span><span class="cat-count">${c.td}</span>`
      + `<button class="cat-more" type="button" aria-haspopup="menu" aria-expanded="false" title="더 보기">⋯</button></div>`).join('');
  body.scrollTop = 0;
}
function items(c, i){
  const last = cats.length - 1;
  const it = (label, o = {}) => `<button type="button" role="menuitem"${o.cls ? ` class="${o.cls}"` : ''}${o.off ? ' disabled' : ''}>${label}</button>`;
  const sep = '<div class="cat-menu-sep"></div>';
  let top = it('수정');
  if(c.data) top += it('다른 과제와 합치기…');
  if(c.kind === 'personal') top += it('공식 과제로 연결…');
  let order;
  if(mode === 'b'){
    const ob = (t, nm, off) => `<button type="button" title="${nm}" aria-label="${nm}"${off ? ' disabled' : ''}>${t}</button>`;
    order = `<div class="ord"><span>순서</span>${ob('⤒', '맨 위로', i <= 0)}${ob('↑', '위로', i <= 0)}${ob('↓', '아래로', i >= last)}${ob('⤓', '맨 아래로', i >= last)}</div>`;
  } else {
    order = '<div class="cat-menu-grp">순서</div>' + it('위로', { off: i <= 0 }) + it('아래로', { off: i >= last }) + it('맨 위로', { off: i <= 0 }) + it('맨 아래로', { off: i >= last });
  }
  const tail = c.kind === 'official' ? it('내 캘린더에서 빼기') : it('삭제…', { cls: 'danger' });
  return top + sep + order + sep + tail;
}
function closeMenu(){
  if(!menu) return;
  menu.el.remove();
  menu.btn.setAttribute('aria-expanded', 'false');
  menu = null;
}
function openMenu(btn){
  const row = btn.closest('.cat-row'), i = +row.dataset.i, c = cats[i];
  const same = menu && menu.btn === btn;
  closeMenu();
  if(same) return;
  let el;
  if(mode === 'c'){
    el = document.createElement('div'); el.className = 'cat-acts';
    const b = (t, o = {}) => `<button type="button"${o.cls ? ` class="${o.cls}"` : ''}${o.off ? ' disabled' : ''}>${t}</button>`;
    const last = cats.length - 1;
    el.innerHTML = b('수정') + (c.data ? b('합치기…') : '') + (c.kind === 'personal' ? b('공식 과제로 연결…') : '')
      + '<span class="gap"></span>' + b('위로', { off: i <= 0 }) + b('아래로', { off: i >= last }) + b('맨 위로', { off: i <= 0 }) + b('맨 아래로', { off: i >= last })
      + '<span class="gap"></span>' + (c.kind === 'official' ? b('내 캘린더에서 빼기') : b('삭제…', { cls: 'danger' }));
    row.appendChild(el);
  } else {
    el = document.createElement('div'); el.className = 'cat-menu'; el.setAttribute('role', 'menu');
    el.innerHTML = items(c, i);
    if(mode === 'cur'){
      el.classList.add('m-cur'); row.appendChild(el);
      // 앱과 같은 판단: 본문 아래가 모자라고, 줄 위에 메뉴 높이만큼 자리가 있으면 위로
      const br = body.getBoundingClientRect(), mr = el.getBoundingClientRect();
      if(mr.bottom > br.bottom && (row.getBoundingClientRect().top - br.top) > mr.height) el.classList.add('up');
    } else {
      el.classList.add('m-float'); win.appendChild(el);
      place(el, btn);
    }
  }
  btn.setAttribute('aria-expanded', 'true');
  menu = { el, btn };
}
// A, B: ⋯ 의 오른쪽 끝에 맞추고 아래가 모자라면 위로, 둘 다 모자라면 화면 안으로 민다. 시안의 화면 = .win
function place(el, btn){
  const w = win.getBoundingClientRect(), b = btn.getBoundingClientRect(), sc = w.width / win.offsetWidth;
  const bx = { top:(b.top - w.top) / sc, bottom:(b.bottom - w.top) / sc, right:(b.right - w.left) / sc };
  const mw = el.offsetWidth, mh = el.offsetHeight, vw = win.clientWidth, vh = win.clientHeight, pad = 8;
  const left = Math.max(pad, Math.min(bx.right - mw, vw - pad - mw));
  let top = bx.bottom + 2;
  if(top + mh > vh - pad) top = (bx.top - 2 - mh >= pad) ? bx.top - 2 - mh : Math.max(pad, vh - pad - mh);
  el.style.left = left + 'px'; el.style.top = top + 'px';
}
let tt = 0;
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('on'), 1200); }

list.addEventListener('click', ev => {
  const m = ev.target.closest('.cat-more'); if(m){ openMenu(m); return; }
});
win.addEventListener('click', ev => {
  const it = ev.target.closest('.cat-menu button, .cat-acts button');
  if(it && !it.disabled){ toast((it.getAttribute('aria-label') || it.textContent.trim()) + ' (시안)'); closeMenu(); }
});
document.addEventListener('pointerdown', ev => {
  if(!menu) return;
  if(ev.target.closest('.cat-menu, .cat-acts, .cat-more')) return;
  closeMenu();
}, true);
document.addEventListener('keydown', ev => { if(ev.key === 'Escape') closeMenu(); });
body.addEventListener('scroll', () => { if(menu && mode !== 'cur' && mode !== 'c') closeMenu(); });
function seg(id, fn){
  $(id).addEventListener('click', ev => {
    const b = ev.target.closest('button'); if(!b) return;
    $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    fn(b.dataset.v);
  });
}
seg('#segMode', v => { mode = v; $('#note').innerHTML = NOTES[v]; build(); });
